name: school_management_system
description: A new Flutter project for school management.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0' # Adjusted to a more current SDK range

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.27.0 # Please check for the latest version
  firebase_auth: ^4.17.8 # Please check for the latest version
  cloud_firestore: ^4.15.8 # Please check for the latest version
  # firebase_functions: ^4.6.0 # For calling Firebase Functions, if needed later
  # firebase_storage: ^11.6.9 # We are using Base64, but good to note if needed

  # UI and State Management (Examples, can be decided later)
  provider: ^6.1.2 # Added for state management (used in SuperAdminDashboard example)
  # flutter_bloc: ^8.1.3

  # For Base64 encoding/decoding
  convert: ^3.1.1

  # For image picking
  image_picker: ^1.0.7 # Please check for latest
  # For general file picking
  file_picker: ^6.2.0 # Please check for latest

  # For date formatting
  intl: ^0.19.0 # Please check for latest

  # For MIME type detection
  mime: ^1.0.4 # Please check for latest


  # For payments (example)
  # stripe_flutter: ^9.5.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # fonts:
  #   - family: Schyler
  #     fonts:
  - family: Trajan Pro
#       - asset: fonts/TrajanPro.ttf
#       - asset: fonts/TrajanPro_Bold.ttf
#         weight: 700
#
